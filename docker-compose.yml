version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: pulseai_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: pulseai
    ports:
      - "5432:5432"

  qdrant:
    image: qdrant/qdrant:latest
    container_name: pulseai_vector_db
    ports:
      - "6333:6333"
